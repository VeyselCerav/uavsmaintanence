name: Keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Render ve Neon uyanık tut
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          url="${HEALTH_URL:-https://uavs-backend.onrender.com/health/?db=1}"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 15 --max-time 90 "$url"
