name: Keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Backend sağlık yoklaması
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "BACKEND_HEALTH_URL yok; Northflank uyumaz, keep-alive atlandı."
            exit 0
          fi
          curl -fsS --retry 4 --retry-all-errors --retry-delay 15 --max-time 90 "$HEALTH_URL"
